name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run portable shell tests
        run: ./tests/run.sh
